; Upload limits for the admin panel: a service gallery can carry four images of
; up to 2 MB each in a single request, so the request cap must exceed 8 MB.
; PHP-FPM and CGI read this file; values here override the host's php.ini.
upload_max_filesize = 5M
post_max_size = 25M
max_file_uploads = 20
memory_limit = 256M
max_input_time = 120
